name: ChangeProof reuse proof

on:
  push:
    branches: [main]
    paths:
      - 'engine/evidence/core.js'
      - 'engine/evidence/collector.js'
      - 'engine/evidence/model.js'
      - 'engine/evidence/diff.js'
      - 'engine/analyzers/config.js'
      - 'engine/profile-runner.js'
      - 'engine/reporters/profile-pack.js'
      - 'examples/timeout-service/CHANGE_REQUEST.md'
      - 'examples/timeout-service/changeproof.profile.js'
      - 'examples/timeout-service/inference.js'
      - 'examples/timeout-service/jest.config.js'
      - 'examples/timeout-service/states/**'
      - 'site.js'
      - 'orderpro-preview.js'
      - 'review-workspace.js'
      - 'reuse-proof.js'
      - 'ironterm-experience.js'
      - 'orderpro/app/orderpro.js'
      - 'package.json'
      - '.github/workflows/reuse-proof.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax gate
        run: |
          node --check engine/evidence/core.js
          node --check engine/evidence/collector.js
          node --check engine/profile-runner.js
          node --check engine/reporters/profile-pack.js
          node --check examples/timeout-service/inference.js
          node --check examples/timeout-service/changeproof.profile.js
          node --check site.js
          node --check orderpro-preview.js
          node --check review-workspace.js
          node --check reuse-proof.js
          node --check ironterm-experience.js
          node --check orderpro/app/orderpro.js

      - name: Preserve ORDERPRO test gate
        run: npm test

      - name: Regenerate and verify current ORDERPRO post-change evidence
        run: |
          npm run post-change
          node - <<'NODE'
          const fs = require('fs');
          const trace = JSON.parse(fs.readFileSync('evidence-pack/post-change/traceability.json','utf8'));
          const tests = JSON.parse(fs.readFileSync('evidence-pack/post-change/test-results.json','utf8'));
          const resolved = trace.filter(f => f.status === 'RESOLVED').length;
          const target = trace.filter(f => f.status === 'TARGET_VALIDATION_REQUIRED').length;
          const open = trace.filter(f => f.status === 'OPEN').length;
          if (trace.length !== 86) throw new Error(`ORDERPRO current finding count changed: ${trace.length} !== 86`);
          if (resolved !== 56 || target !== 30 || open !== 0) {
            throw new Error(`ORDERPRO current evidence semantics changed: resolved=${resolved}, target=${target}, open=${open}`);
          }
          if (trace.some(f => f.id === 'inferred-fulmnt-batch-window-collision')) {
            throw new Error('ORDERPRO post-change evidence unexpectedly contains the baseline collision');
          }
          if (tests.numPassedTests !== 16 || tests.numFailedTests !== 0 || tests.numPendingTests !== 3) {
            throw new Error(`ORDERPRO test receipt changed: ${tests.numPassedTests}/${tests.numFailedTests}/${tests.numPendingTests}`);
          }
          console.log('ORDERPRO current evidence verified: 86 findings, 56 resolved, 30 target-validation-required, tests 16/0/3.');
          NODE

      - name: Generate independent reuse evidence
        run: npm run reuse-proof

      - name: Verify reusable-workload behavior
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const base = read('examples/timeout-service/evidence-pack/baseline/traceability.json');
          const literal = read('examples/timeout-service/evidence-pack/literal/traceability.json');
          const post = read('examples/timeout-service/evidence-pack/post-change/traceability.json');
          const baselineTests = read('examples/timeout-service/evidence-pack/baseline/test-results.json');
          const literalTests = read('examples/timeout-service/evidence-pack/literal/test-results.json');
          const postTests = read('examples/timeout-service/evidence-pack/post-change/test-results.json');

          const mismatch = literal.find(f => f.id === 'inferred-upstream-timeout-ordering');
          if (!mismatch) throw new Error('literal pass did not produce inferred upstream timeout mismatch');
          if (mismatch.evidenceBasis !== 'INFERRED' || mismatch.status !== 'OPEN' || mismatch.validationTarget !== 'LOCAL') {
            throw new Error('literal mismatch evidence semantics are incorrect');
          }
          if (post.some(f => f.id === 'inferred-upstream-timeout-ordering')) throw new Error('remediated pass still contains timeout mismatch');
          if (base.some(f => f.id === 'inferred-upstream-timeout-ordering')) throw new Error('baseline unexpectedly contains timeout mismatch');
          if (baselineTests.numPassedTests !== 1 || baselineTests.numFailedTests !== 1) throw new Error(`baseline scoped receipt changed: ${baselineTests.numPassedTests}/${baselineTests.numFailedTests}`);
          if (literalTests.numPassedTests !== 2 || literalTests.numFailedTests !== 0 || postTests.numPassedTests !== 2 || postTests.numFailedTests !== 0) throw new Error('literal/remediated scoped acceptance receipts changed');
          console.log('Reuse proof verified: baseline 1/1; literal 2/0 + inferred OPEN mismatch; remediation 2/0 and mismatch removed.');
          NODE

      - name: Refresh Pages asset revision
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('site.css?v=20260828-1', 'site.css?v=20260828-6')
          text = text.replace('site.js?v=20260828-1', 'site.js?v=20260828-6')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated evidence receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence-pack/post-change examples/timeout-service/evidence-pack index.html
          if git diff --cached --quiet; then
            echo 'Generated evidence and Pages shell are already current.'
          else
            git commit -m 'Refresh evidence and Pages shell [evidence-freeze]'
            git push
          fi
